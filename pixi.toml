[workspace]
preview = ["pixi-build"]
channels = [
	"robostack-jazzy",
	"conda-forge",
	"https://prefix.dev/pixi-build-backends"
]
platforms = ["linux-64"]


[package.build]
backend = { name = "pixi-build-ros", version = "*"}

[package.build.config]
distro = "jazzy"

extra-input-globs = [
    "**/*.xacro",
    "**/*.urdf",
]



[dependencies]
ros-jazzy-sts-hardware-interface = { path = "." }
ros-jazzy-desktop = ">=0.11.0,<0.12"
